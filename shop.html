<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPO BRAND | Shop</title>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #f5f5f5;
            --border: 2px solid #000;
            --transition: 0.3s;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* يزيل المربع الأزرق */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: var(--white);
            color: var(--black);
        }

        /* إزالة المربع الأزرق من جميع العناصر القابلة للنقر */
        a, button, div, img {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* الشعار */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo-text span {
            background: #000;
            color: #fff;
            padding: 0 5px;
        }

        .header {
            background: var(--white);
            border-bottom: var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav a {
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }

        .nav a:hover,
        .nav a.active {
            text-decoration: underline;
        }

        .cart-badge {
            background: var(--black);
            color: var(--white);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .menu-toggle {
            display: none;
            background: var(--white);
            border: var(--border);
            padding: 0.5rem 0.8rem;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .mobile-menu {
            display: none;
            background: var(--white);
            border-bottom: var(--border);
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            z-index: 99;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 1rem;
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: var(--border);
            padding-bottom: 1rem;
        }

        /* شبكة المنتجات - صفين وعمودين */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* عمودين */
            grid-template-rows: repeat(3, auto); /* ثلاثة صفوف */
            gap: 1.5rem;
        }

        .product-card {
            border: var(--border);
            background: var(--white);
            transition: var(--transition);
            text-decoration: none;
            color: var(--black);
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        .product-card:hover {
            transform: translate(-5px, -5px);
            box-shadow: 5px 5px 0 var(--black);
        }

        .product-image {
            height: 350px;
            border-bottom: var(--border);
            background: var(--gray);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.4s ease;
        }

        /* تكبير الصورة عند الضغط عليها */
        .product-image:active img {
            transform: scale(1.2);
        }

        .product-placeholder {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 6rem;
        }

        .product-number {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--black);
            color: var(--white);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 2;
            pointer-events: none; /* يمنع تداخل النقر */
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .product-name {
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 900;
        }

        /* زر عرض المنتج */
        .view-product-btn {
            display: block;
            background: var(--black);
            color: var(--white);
            border: var(--border);
            padding: 0.8rem;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.9rem;
            margin-top: auto;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .view-product-btn:hover {
            background: var(--white);
            color: var(--black);
        }

        .view-product-btn:active {
            background: var(--black);
            color: var(--white);
        }

        /* للشاشات المتوسطة */
        @media (max-width: 768px) {
            .nav {
                display: none;
            }
            
            .menu-toggle {
                display: block;
            }
            
            .products-grid {
                grid-template-columns: repeat(2, 1fr); /* عمودين */
                gap: 1rem;
            }
            
            .product-image {
                height: 250px;
            }
            
            .logo-img {
                height: 35px;
            }
            
            .logo-text {
                font-size: 1.2rem;
            }
        }

        /* للشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr); /* يبقى عمودين */
                gap: 0.8rem;
            }
            
            .product-image {
                height: 200px;
            }
            
            .product-name {
                font-size: 0.8rem;
            }
            
            .product-price {
                font-size: 1rem;
            }
            
            .view-product-btn {
                padding: 0.6rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <img src="lo2.PNG" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                <span class="logo-text">CAPO<span>BRAND</span></span>
            </a>
            
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="shop.html" class="active">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">
                    Cart
                    <span class="cart-badge" id="cartBadge">0</span>
                </a>
            </nav>
            
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="mobileCartBadge">0</span>)</a>
    </div>

    <div class="container">
        <h1 class="page-title">CAPO COLLECTION</h1>
        
        <div class="products-grid" id="shopProducts"></div>
    </div>

    <script>
        const products = [
            { id: 1, name: "CAPO 1", price: 150, image: "te1.jpeg" },
            { id: 2, name: "CAPO 2", price: 175, image: "te2.jpeg" },
            { id: 3, name: "CAPO 3", price: 150, image: "te3.jpeg" },
            { id: 4, name: "CAPO 4", price: 150, image: "te4.jpeg" },
            { id: 5, name: "CAPO 5", price: 150, image: "te5.jpeg" },
            { id: 6, name: "CAPO 6", price: 150, image: "te6.jpeg" }
        ];

        localStorage.setItem('capo_products', JSON.stringify(products));

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('capo_cart')) || [];
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').textContent = count;
            document.getElementById('mobileCartBadge').textContent = count;
        }

        function displayProducts() {
            const container = document.getElementById('shopProducts');
            
            container.innerHTML = products.map((product, index) => `
                <div class="product-card">
                    <div class="product-image" onclick="window.location.href='product.html?id=${product.id}'">
                        <img src="${product.image}" alt="${product.name}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <span class="product-placeholder" style="display: none;">👕</span>
                        <span class="product-number">${String(index + 1).padStart(2, '0')}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price} LYD</div>
                        <a href="product.html?id=${product.id}" class="view-product-btn">
                            View Product
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('mobileMenu').classList.toggle('active');
        });

        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', function() {
                document.getElementById('mobileMenu').classList.remove('active');
            });
        });

        updateCartBadge();
        displayProducts();
    </script>
</body>
</html>
